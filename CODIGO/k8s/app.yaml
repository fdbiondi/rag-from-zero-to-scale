apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
data:
  OLLAMA_URL: http://ollama:11434
  QDRANT_URL: http://qdrant:6333
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: rag-api}
  template:
    metadata:
      labels: {app: rag-api}
    spec:
      containers:
        - name: api
          image: rag-backend:dev
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3001}]
          envFrom: [{configMapRef: {name: rag-config}}]
          readinessProbe:
            httpGet: {path: /health, port: 3001}
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
spec:
  selector: {app: rag-api}
  ports: [{port: 3001, targetPort: 3001}]
